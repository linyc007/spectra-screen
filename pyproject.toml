[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-screen"
version = "0.1.0"
description = "Find the few wavelengths that matter - reproducible wavelength screening and spectral ML benchmarks for hyperspectral/NIR data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yucai Lin", email = "yucai.lin@aalto.fi" }]
keywords = ["spectroscopy", "hyperspectral", "nir", "chemometrics", "wavelength-selection", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
tabpfn = ["tabpfn>=2.0"]

[project.scripts]
screener = "spectra_screen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
